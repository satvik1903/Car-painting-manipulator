arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  mode: local                  # stay close to the previous solution: smooth strokes, no jumps
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.001    # 1 mm   (well inside R3's 1.5 cm)
  orientation_threshold: 0.01  # 0.6 deg (well inside R4's 5 deg)
  cost_threshold: 0.001
  minimal_displacement_weight: 0.0
  gd_step_size: 0.0001

gantry_arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  mode: local
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.001
  orientation_threshold: 0.01
  cost_threshold: 0.001
  minimal_displacement_weight: 0.0
  gd_step_size: 0.0001